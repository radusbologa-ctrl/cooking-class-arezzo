name: IndexNow submit december page

on:
  push:
    branches:
      - claude/cooking-class-seo-geo-szlgnk
    paths:
      - ".github/workflows/fetch-gyg.yml"

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Submit URLs to IndexNow (Bing, Yandex, Seznam)
        continue-on-error: true
        run: |
          cat > /tmp/payload.json << 'JSON'
          {
            "host": "cookingclassarezzo.it",
            "key": "97f1df9f316a6fcdaafe34ea0a6fa7c4",
            "keyLocation": "https://cookingclassarezzo.it/97f1df9f316a6fcdaafe34ea0a6fa7c4.txt",
            "urlList": [
              "https://cookingclassarezzo.it/",
              "https://cookingclassarezzo.it/it/",
              "https://cookingclassarezzo.it/tuscany-in-december/"
            ]
          }
          JSON
          echo "===== key file reachable ====="
          curl -sS -w "\nstatus=%{http_code}\n" https://cookingclassarezzo.it/97f1df9f316a6fcdaafe34ea0a6fa7c4.txt
          echo "===== api.indexnow.org ====="
          curl -sS -w "\nstatus=%{http_code}\n" -X POST "https://api.indexnow.org/indexnow" -H "Content-Type: application/json; charset=utf-8" --data-binary @/tmp/payload.json
          echo "===== bing ====="
          curl -sS -w "\nstatus=%{http_code}\n" -X POST "https://www.bing.com/indexnow" -H "Content-Type: application/json; charset=utf-8" --data-binary @/tmp/payload.json
