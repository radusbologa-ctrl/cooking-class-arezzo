name: Fetch legal footer v2

on:
  push:
    branches:
      - claude/cooking-class-seo-geo-szlgnk
    paths:
      - ".github/workflows/fetch-gyg.yml"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch activewise.biz and extract footer text
        continue-on-error: true
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          for URL in "https://activewise.biz" "https://actiwise.biz" "https://www.actiwise.biz" "https://activewise.it" "https://actiwise.it" "https://www.actiwise.it"; do
            echo "===== FETCH $URL ====="
            curl -sL -A "$UA" --max-time 40 "$URL" -o /tmp/aw.html && echo "SIZE: $(wc -c < /tmp/aw.html)" && break || echo FETCH_FAILED
          done
          python3 << 'PYEOF'
          import re, html
          t = open('/tmp/aw.html', encoding='utf-8', errors='replace').read()
          body = re.sub(r'<script.*?</script>|<style.*?</style>', ' ', t, flags=re.S)
          body = re.sub(r'<[^>]+>', '\n', body)
          body = html.unescape(body)
          lines = [l.strip() for l in body.split('\n') if len(l.strip()) > 1]
          seen = set(); out = []
          for l in lines:
              if l not in seen:
                  seen.add(l); out.append(l)
          print("===== LAST 80 TEXT LINES (footer area) =====")
          print('\n'.join(out[-80:]))
          print("===== KEYWORD LINES =====")
          for l in out:
              if re.search(r'(?i)p\.?\s*iva|partita|vat|cf\b|codice fiscale|sdi|pec|radus|bologa|agency|privacy|cookie|termini|sede', l):
                  print(l)
          PYEOF
