name: Fetch GYG listing

on:
  push:
    branches:
      - claude/cooking-class-seo-geo-szlgnk
    paths:
      - ".github/workflows/fetch-gyg.yml"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and extract
        continue-on-error: true
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          URL="https://www.getyourguide.com/comune-di-arezzo-l1394/arezzo-lezione-di-cucina-con-pasta-e-tiramisu-vino-illimitato-t1183544/"
          curl -sL -A "$UA" -H "Accept-Language: it-IT,it;q=0.9,en;q=0.8" --max-time 40 "$URL" -o /tmp/g.html || echo FETCH_FAILED
          echo "SIZE: $(wc -c < /tmp/g.html)"
          python3 << 'PYEOF'
          import re, html, json
          t = open('/tmp/g.html', encoding='utf-8', errors='replace').read()
          print("===== TITLE ====="); m = re.search(r'<title>(.*?)</title>', t, re.S); print(html.unescape(m.group(1)) if m else 'none')
          for name in ['description']:
              m = re.search(r'<meta name="%s" content="([^"]*)"' % name, t); print("META:", html.unescape(m.group(1)) if m else 'none')
          print("===== JSON-LD =====")
          for b in re.findall(r'<script type="application/ld\+json"[^>]*>(.*?)</script>', t, re.S):
              b = b.strip()
              print(b[:7000]); print("---")
          print("===== TEXT EXTRACT =====")
          body = re.sub(r'<script.*?</script>|<style.*?</style>', ' ', t, flags=re.S)
          body = re.sub(r'<[^>]+>', '\n', body)
          body = html.unescape(body)
          lines = [l.strip() for l in body.split('\n') if len(l.strip()) > 2]
          seen = set(); out = []
          for l in lines:
              if l not in seen:
                  seen.add(l); out.append(l)
          print('\n'.join(out[:400]))
          PYEOF
