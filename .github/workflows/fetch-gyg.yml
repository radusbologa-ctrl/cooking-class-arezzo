name: SEO conflict audit both sites

on:
  push:
    branches:
      - claude/cooking-class-seo-geo-szlgnk
    paths:
      - ".github/workflows/fetch-gyg.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Head tags of every cooking page on both sites
        continue-on-error: true
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          for URL in \
            "https://ilpoggiolinodoro.it/cooking-class-arezzo/" \
            "https://ilpoggiolinodoro.it/en/cooking-class-arezzo/" \
            "https://cookingclassarezzo.it/" \
            "https://cookingclassarezzo.it/it/" \
            "https://cookingclassarezzo.it/tuscany-in-december/"; do
            echo "================== $URL =================="
            curl -sSL -A "$UA" --max-time 25 -w "final_status=%{http_code}\n" -o /tmp/p.html "$URL" || { echo FETCH_FAILED; continue; }
            python3 - << 'PYEOF'
          import re, html
          t = open('/tmp/p.html', encoding='utf-8', errors='replace').read()
          def show(label, pattern, flags=0):
              ms = re.findall(pattern, t, flags)
              for m in ms[:6]:
                  print(f"{label}: {html.unescape(m.strip())[:160]}")
              if not ms: print(f"{label}: NONE")
          show("TITLE", r'<title>(.*?)</title>', re.S)
          show("DESC", r'<meta name="description" content="([^"]*)"')
          show("ROBOTS", r'<meta name="robots" content="([^"]*)"')
          show("CANONICAL", r'<link rel="canonical" href="([^"]*)"')
          show("HREFLANG", r'<link rel="alternate" hreflang="([^"]*)" href="[^"]*"')
          show("H1", r'<h1[^>]*>(.*?)</h1>', re.S)
          print("noindex-anywhere:", len(re.findall(r'noindex', t)))
          print("schema-types:", sorted(set(re.findall(r'"@type"\s*:\s*"([A-Za-z]+)"', t))))
          PYEOF
          done
      - name: Robots.txt both sites
        continue-on-error: true
        run: |
          echo "===== cookingclassarezzo.it/robots.txt ====="
          curl -sS --max-time 20 https://cookingclassarezzo.it/robots.txt || true
          echo "===== ilpoggiolinodoro.it/robots.txt ====="
          curl -sS --max-time 20 https://ilpoggiolinodoro.it/robots.txt || true
