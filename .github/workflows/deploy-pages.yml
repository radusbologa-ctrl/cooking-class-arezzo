name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/cooking-class-seo-geo-szlgnk
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages (enable site if needed)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Set custom domain
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/pages" \
            -f cname=www.cookingclassarezzo.it \
            && echo "Custom domain set via API" \
            || echo "::warning::Could not set custom domain via API — set it manually in Settings > Pages"

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
