name: Fetch legal footer v4

on:
  push:
    branches:
      - claude/cooking-class-seo-geo-szlgnk
    paths:
      - ".github/workflows/fetch-gyg.yml"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Render actiwise.biz with headless Chrome and extract legal data
        continue-on-error: true
        run: |
          for P in "" "TerminiCondizioni" "SicurezzaConformita"; do
            URL="https://actiwise.biz/$P"
            echo "=========== PAGE: $URL ==========="
            timeout 60 google-chrome --headless=new --disable-gpu --no-sandbox --virtual-time-budget=15000 --dump-dom "$URL" > /tmp/p.html 2>/dev/null || echo RENDER_FAILED
            echo "SIZE: $(wc -c < /tmp/p.html)"
            python3 - << 'PYEOF'
          import re, html
          t = open('/tmp/p.html', encoding='utf-8', errors='replace').read()
          body = re.sub(r'<script.*?</script>|<style.*?</style>', ' ', t, flags=re.S)
          body = re.sub(r'<[^>]+>', '\n', body)
          body = html.unescape(body)
          lines = [l.strip() for l in body.split('\n') if len(l.strip()) > 1]
          seen = set(); out = []
          for l in lines:
              if l not in seen:
                  seen.add(l); out.append(l)
          print("--- last 40 lines ---")
          print('\n'.join(out[-40:]))
          print("--- keyword hits ---")
          for l in out:
              if re.search(r'(?i)iva|vat|codice|sdi|pec|radus|bologa|agency|sede legale', l):
                  print("HIT:", l[:300])
          PYEOF
          done
