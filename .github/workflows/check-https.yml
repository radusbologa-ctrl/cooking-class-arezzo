name: Check HTTPS certificate # status check

on:
  workflow_dispatch:
  push:
    branches:
      - claude/cooking-class-seo-geo-szlgnk
    paths:
      - ".github/workflows/check-https.yml"

permissions:
  contents: read
  pages: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: TLS certificate served on apex
        continue-on-error: true
        run: |
          echo "===== CERT apex ====="
          echo | timeout 15 openssl s_client -connect cookingclassarezzo.it:443 -servername cookingclassarezzo.it 2>/dev/null | openssl x509 -noout -subject -issuer -dates || echo "NO_CERT_APEX"
          echo "===== CERT www ====="
          echo | timeout 15 openssl s_client -connect www.cookingclassarezzo.it:443 -servername www.cookingclassarezzo.it 2>/dev/null | openssl x509 -noout -subject -issuer -dates || echo "NO_CERT_WWW"

      - name: HTTP responses
        continue-on-error: true
        run: |
          echo "===== HTTPS apex ====="
          curl -sS -o /dev/null -w "status=%{http_code} ssl_verify=%{ssl_verify_result}\n" --max-time 20 https://cookingclassarezzo.it/ || echo "HTTPS_APEX_FAILED"
          echo "===== HTTP apex (redirect?) ====="
          curl -sS -o /dev/null -w "status=%{http_code} redirect=%{redirect_url}\n" --max-time 20 http://cookingclassarezzo.it/ || true
          echo "===== HTTPS www ====="
          curl -sS -o /dev/null -w "status=%{http_code} ssl_verify=%{ssl_verify_result}\n" --max-time 20 https://www.cookingclassarezzo.it/ || echo "HTTPS_WWW_FAILED"
          echo "===== page title over https (insecure ok) ====="
          curl -sSk --max-time 20 https://cookingclassarezzo.it/ | grep -oE "<title>[^<]*</title>|google-site-verification[^>]*" | head -2 || true
          echo "===== sitemap.xml ====="
          curl -sS -o /tmp/sm.xml -w "status=%{http_code} type=%{content_type} size=%{size_download}\n" --max-time 20 https://cookingclassarezzo.it/sitemap.xml || echo "SITEMAP_FAILED"
          head -3 /tmp/sm.xml || true
          echo "===== robots.txt ====="
          curl -sS --max-time 20 https://cookingclassarezzo.it/robots.txt | head -8 || true
          echo "===== backlink from ilpoggiolinodoro.it ====="
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          curl -sL -A "$UA" --max-time 25 https://www.ilpoggiolinodoro.it/ -o /tmp/pdo.html || echo "PDO_FETCH_FAILED"
          echo "links to cookingclassarezzo.it: $(grep -c 'cookingclassarezzo.it' /tmp/pdo.html || true)"
          grep -oE 'href="https://cookingclassarezzo.it[^"]*"' /tmp/pdo.html | sort | uniq -c || echo "NO_BACKLINK_FOUND"
          echo "broken wa.me/39 links left: $(grep -c 'wa.me/39\"' /tmp/pdo.html || true)"
          echo "wa.me full links: $(grep -oE 'wa.me/[0-9]+' /tmp/pdo.html | sort -u | tr '\n' ' ')"

      - name: Official Pages API status
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "===== Pages API ====="
          gh api "repos/${{ github.repository }}/pages" || echo "PAGES_API_DENIED"
          echo "===== Pages health check ====="
          gh api "repos/${{ github.repository }}/pages/health" || echo "HEALTH_API_DENIED"
