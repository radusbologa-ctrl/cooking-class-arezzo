name: Fetch legal footer v3

on:
  push:
    branches:
      - claude/cooking-class-seo-geo-szlgnk
    paths:
      - ".github/workflows/fetch-gyg.yml"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch actiwise.biz pages and extract legal data
        continue-on-error: true
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          for P in "" "termini-condizioni" "terms" "privacy" "privacy-policy" "sicurezza-conformita" "sitemap" "home"; do
            URL="https://actiwise.biz/$P"
            echo "=========== PAGE: $URL ==========="
            curl -sL -A "$UA" --max-time 30 "$URL" -o /tmp/p.html || { echo FETCH_FAILED; continue; }
            echo "SIZE: $(wc -c < /tmp/p.html)"
            python3 - << 'PYEOF'
          import re, html
          t = open('/tmp/p.html', encoding='utf-8', errors='replace').read()
          body = re.sub(r'<script.*?</script>|<style.*?</style>', ' ', t, flags=re.S)
          body = re.sub(r'<[^>]+>', '\n', body)
          body = html.unescape(body)
          lines = [l.strip() for l in body.split('\n') if len(l.strip()) > 1]
          seen = set(); out = []
          for l in lines:
              if l not in seen:
                  seen.add(l); out.append(l)
          for l in out:
              if re.search(r'(?i)iva|partita|vat|codice|sdi|pec|radus|bologa|agency|sede|via |p\.za|email|@', l):
                  print("HIT:", l[:300])
          PYEOF
          done
          echo "=========== sitemap.xml ==========="
          curl -sL -A "$UA" --max-time 30 "https://actiwise.biz/sitemap.xml" | head -c 3000
